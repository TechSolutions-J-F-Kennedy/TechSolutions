<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Kennedy Tech Solutions</title>

  <!-- Google Fonts: Space Grotesk + Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-wrapper">
    <!-- Card Principal -->
    <div class="login-card">
      
      <!-- Encabezado / Logo -->
      <div class="login-header">
        <div class="tag">
          <i data-lucide="wrench"></i> Kennedy Tech Solutions
        </div>
        <div class="logo">
          Kennedy <span>Tech</span>
        </div>
        <p id="form-subtitle">Ingresá tus credenciales para acceder a la plataforma.</p>
      </div>

      <!-- ================= FORMULARIO DE INICIO DE SESIÓN ================= -->
      <form id="login-form" class="auth-form" onsubmit="event.preventDefault();">
        <div class="field">
          <label for="login-user">Usuario o correo electrónico</label>
          <div class="input-icon-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="login-user" placeholder="Ej.: usuario123" required>
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="login-password">Contraseña</label>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-icon-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Recordar mi sesión</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i data-lucide="log-in"></i> Iniciar sesión
        </button>

        <p class="switch-mode-text">
          ¿No tenés una cuenta? <a href="#" id="go-to-register">Registrate acá</a>
        </p>
      </form>

      <!-- ================= FORMULARIO DE REGISTRO ================= -->
      <form id="register-form" class="auth-form hidden" onsubmit="event.preventDefault();">
        <div class="field">
          <label for="reg-username">Nombre de usuario</label>
          <div class="input-icon-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="reg-username" placeholder="Ej.: juanperez" required>
          </div>
        </div>

        <div class="field">
          <label for="reg-email">Correo electrónico</label>
          <div class="input-icon-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="reg-email" placeholder="cliente@ejemplo.com" required>
          </div>
        </div>

        <div class="field">
          <label for="reg-address">Dirección</label>
          <div class="input-icon-wrapper">
            <i data-lucide="map-pin" class="input-icon"></i>
            <input type="text" id="reg-address" placeholder="Calle y número" required>
          </div>
        </div>


        <div class="field">
  <label for="reg-phone">Teléfono</label>
  <div class="input-icon-wrapper">
    <i data-lucide="phone" class="input-icon"></i>
    <input type="tel" id="reg-phone" placeholder="Ej.: 1112345678">
  </div>
</div>


        <div class="field">
          <label for="reg-password">Contraseña</label>
          <div class="input-icon-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="reg-password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="field">
          <label for="reg-confirm-password">Confirmar contraseña</label>
          <div class="input-icon-wrapper">
            <i data-lucide="lock-check" class="input-icon"></i>
            <input type="password" id="reg-confirm-password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-secondary btn-block">
          <i data-lucide="user-plus"></i> Crear mi cuenta
        </button>

        <p class="switch-mode-text">
          ¿Ya tenés una cuenta? <a href="#" id="go-to-login">Iniciá sesión</a>
        </p>
      </form>

    </div>

    <!-- Pie de página -->
    <footer class="login-footer">
      Kennedy Tech Solutions · Web Desktop + PWA
    </footer>
  </div>

<!-- Enlazar script externo del Frontend -->
  <script src="js/autenticacion.js"></script>
</body>
</html>
</body>
</html>
