<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <title>Herramientas · Kennedy Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/herramientas.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- App instalable (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#172554">
    <link rel="icon" type="image/png" href="img/icono-192.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kennedy Tech">
  </head>

  <body>
    <div class="app">
      <div class="head">
        <small>PRÓXIMAMENTE</small>
        <h1>Herramientas</h1>
      </div>

      <div class="wrap">
        <div class="g">
          <div class="card">
            <i data-lucide="ruler"></i>
            <b>Medidas</b>
            <small>Próximamente</small>
          </div>

          <div class="card">
            <i data-lucide="calculator"></i>
            <b>Calculadora</b>
            <small>Próximamente</small>
          </div>

          <div class="card">
            <i data-lucide="qr-code"></i>
            <b>Escáner QR</b>
            <small>Próximamente</small>
          </div>

          <div class="card">
            <i data-lucide="file-text"></i>
            <b>Reportes</b>
            <small>Próximamente</small>
          </div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
