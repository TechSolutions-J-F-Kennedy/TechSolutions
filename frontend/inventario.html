<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla desde JSON</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Registros desde un archivo JSON</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>codigo</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            <!-- Los datos se inyectarán aquí mediante JavaScript -->
        </tbody>
    </table>

    <script src="stock.js">
    </script>

</body>
</html>
