<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/inventario.css" />
    <title>Inventario</title>
</head>
<body>
    <main>
        <h1>Inventario</h1>

        <section class="panel" aria-labelledby="filtros-titulo">
            <h2 id="filtros-titulo">Buscar productos</h2>
            <form id="form-filtros" class="filtros">
                <label>
                    Nombre
                    <input type="search" name="nombre" placeholder="Nombre del producto" />
                </label>
                <label>
                    Código SKU
                    <input type="search" name="codigo" placeholder="Código SKU" />
                </label>
                <label>
                    Stock máximo
                    <input type="number" name="stock_max" min="0" step="1" placeholder="Ej. 5" />
                </label>
                <button type="submit">Buscar</button>
                <button type="reset" class="boton-secundario">Limpiar</button>
            </form>
            <div class="filtros-rapidos" aria-label="Filtros rápidos">
                <button type="button" class="boton-secundario" data-stock-max="0">Sin stock</button>
                <button type="button" class="boton-secundario" data-stock-max="4">Stock bajo (&le; 4)</button>
            </div>
        </section>

        <details class="panel" id="panel-agregar">
            <summary>Agregar producto</summary>
            <form id="form-agregar" class="form-producto">
                <label>Código SKU<input name="codigo_sku" required /></label>
                <label>Código QR<input name="codigo_qr" /></label>
                <label>Nombre<input name="nombre" required /></label>
                <label>Descripción<input name="descripcion" /></label>
                <label>Stock actual<input name="stock_actual" type="number" min="0" step="1" value="0" required /></label>
                <label>Stock mínimo<input name="stock_minimo" type="number" min="0" step="1" value="0" required /></label>
                <button type="submit">Guardar producto</button>
                <button type="reset" class="boton-secundario">Limpiar</button>
                <button type="button" class="boton-secundario" id="cerrar-panel-agregar">Cerrar</button>
            </form>
        </details>

        <div id="error-box" class="error" role="alert" hidden></div>
        <div id="estado" class="estado" role="status" aria-live="polite"></div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código SKU</th>
                        <th>Código QR</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Stock actual</th>
                        <th>Stock mínimo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    <tr><td colspan="8">Cargando productos...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="./js/stock.js"></script>
</body>
</html>
