<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/inventario.css" />
    <title>Inventario</title>
</head>
<body>

    <h2>Inventario</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Código SKU</th>
                <th>Código QR</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Stock actual</th>
                <th>Stock mínimo</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            <tr>
                <td colspan="7">Cargando productos...</td>
            </tr>
            <tr><td class="agregar">haz click aquí para agregar un nuevo producto a la lista</td></tr>
        </tbody>
    </table>

    <div id="error-box" class="error"></div>

    <script src="./js/stock.js"></script>
</body>
</html>
