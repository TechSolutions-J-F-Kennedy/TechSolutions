<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <title>Chat · Kennedy Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/chat.css">
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div class="app">
      <div class="head">
        <small>MENSAJES</small>
        <h1>Chats</h1>

        <div class="search">
          <i data-lucide="search"></i>
          <input id="q" placeholder="Buscar chat" autocomplete="off">
        </div>
      </div>

      <div id="ls"></div>
    </div>

    <div class="conv" id="cv">
      <div class="ch">
        <button class="ib" id="bk">
          <i data-lucide="arrow-left"></i>
        </button>
        <div class="av" id="cav"></div>

        <div class="who">
          <b id="cn"></b>
          <small id="cs"></small>
        </div>
      </div>

      <div class="cm" id="cm"></div>

      <div class="cb">
        <input class="input" id="t" placeholder="Escribe un mensaje" autocomplete="off">
        <button class="btn btn-primary" id="sd">
          <i data-lucide="send"></i>
        </button>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
