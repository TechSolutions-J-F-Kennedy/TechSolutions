<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flujo de Solicitud y Seguimiento — Kennedy Tech Solutions</title>

  <!-- Google Fonts: Space Grotesk + Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/servicios-styles.css">
  <!-- en el <head>, al final -->
<link rel="stylesheet" href="css/tema.css">   <!-- después de los demás CSS -->
<script src="js/tema.js"></script>
</head>
<body>

  <div class="mobile-container">
    
    <!-- Encabezado de la App -->
    <header class="phone-head">
      <div class="head-top">
        <a href="home.html" class="icon-btn" aria-label="Volver">
          <i data-lucide="arrow-left"></i>
        </a>
        <div class="brand">
          <small>KENNEDY TECH</small>
          <h4 id="page-title">Solicitar servicio</h4>
        </div>
        <button class="icon-btn" aria-label="Ayuda">
          <i data-lucide="help-circle"></i>
        </button>
      </div>
    </header>
    <main class="phone-body">
        <div id="contenedor-pedidos"  class="contenedor-pedidos"></div>
    </main>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
      <a href="home.html" style="text-decoration: none; color: inherit;">
      <div id="nav-btn-home" class="nav-item">
        <i data-lucide="house"></i>
        <span>Inicio</span>
      </div>
      </a>
      <a href="servicios.html" style="text-decoration: none; color: inherit;">
       <div class="nav-item">
        <i data-lucide="clipboard-list"></i>
        <span>Solicitar</span>
      </div>
      </a>
      <div class="nav-item  active">
        <i data-lucide="clipboard-list"></i>
        <span>Pedidos</span>
      </div>
      <a href="mensajes.html" style="text-decoration: none; color: inherit;">
        <div class="nav-item">
          <i data-lucide="message-square"></i>
          <span> Mis Chats</span>
          </div>
        </a>
      <a href="perfil.html" style="text-decoration: none; color: inherit;">
        <div class="nav-item">
          <i data-lucide="user"></i>
          <span>Perfil</span>
        </div>
      </a>
    </nav>
  </div>

  <!-- Modal Calificación y Reseña -->
  <div id="modal-resena" style="display:none; position:fixed; inset:0; z-index:999; background:rgba(0,0,0,0.6); align-items:flex-end;">
    <div style="background:#fff; width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:24px; box-sizing:border-box;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:1.15rem;">Calificar Servicio</h3>
        <button type="button" class="icon-btn" onclick="cerrarModalResena()" style="background:none; border:none; cursor:pointer;">
          <i data-lucide="x"></i>
        </button>
      </div>
      <p style="font-size:0.9rem; color:#64748b; margin-top:0;">Contanos qué tal fue la atención del técnico:</p>
      <form id="form-resena" onsubmit="enviarResena(event)">
        <input type="hidden" id="resena-pedido-id" value="">
        <div style="display:flex; justify-content:center; gap:8px; margin:16px 0; font-size:2rem; cursor:pointer; color:#f59e0b;" id="estrellas-selector">
          <span data-star="1">★</span>
          <span data-star="2">★</span>
          <span data-star="3">★</span>
          <span data-star="4">★</span>
          <span data-star="5">★</span>
        </div>
        <input type="hidden" id="resena-estrella" value="5">
        <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:6px;">Comentario (opcional):</label>
        <textarea id="resena-comentario" rows="3" style="width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:10px; box-sizing:border-box; font-family:inherit;" placeholder="Ej. El técnico llegó puntual y solucionó todo rápido."></textarea>
        <button type="submit" class="btn-action primary" style="width:100%; margin-top:16px; padding:12px; justify-content:center; display:flex; align-items:center; gap:8px;">
          <i data-lucide="send"></i> Enviar Calificación
        </button>
      </form>
    </div>
  </div>

  <!-- Modal Comprobante Simulado -->
  <div id="modal-comprobante" style="display:none; position:fixed; inset:0; z-index:999; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; width:100%; max-width:400px; border-radius:16px; padding:24px; box-sizing:border-box; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
      <div style="text-align:center; margin-bottom:16px;">
        <div style="display:inline-flex; padding:10px; border-radius:50%; background:#dcfce7; color:#16a34a; margin-bottom:8px;">
          <i data-lucide="check-circle" style="width:32px; height:32px;"></i>
        </div>
        <h3 style="margin:0; font-size:1.2rem;">Comprobante de Servicio</h3>
        <small style="color:#64748b;" id="comprobante-id">#ORD-00</small>
      </div>
      <div style="border-top:1px dashed #cbd5e1; border-bottom:1px dashed #cbd5e1; padding:16px 0; margin-bottom:16px; font-size:0.9rem;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="color:#64748b;">Técnico:</span>
          <strong id="comprobante-tecnico">-</strong>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="color:#64748b;">Fecha:</span>
          <span id="comprobante-fecha">-</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="color:#64748b;">Servicio:</span>
          <span id="comprobante-desc" style="max-width:180px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">-</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:1.1rem; font-weight:700;">
          <span>Total Cobrado:</span>
          <span style="color:#16a34a;" id="comprobante-monto">$18.500</span>
        </div>
      </div>
      <div style="background:#f1f5f9; padding:10px; border-radius:8px; text-align:center; font-size:0.8rem; color:#475569; margin-bottom:16px;">
        <span>✓ Pago simulado en destino · Sin costo real</span>
      </div>
      <button type="button" class="btn-action primary" onclick="cerrarModalComprobante()" style="width:100%; padding:12px; justify-content:center; display:flex; align-items:center; gap:8px;">
        <i data-lucide="check"></i> Listo
      </button>
    </div>
  </div>

  <script src="js/pedidos.js"></script>

</body>
</html>
