<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <title>Inicio · Kennedy Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pendientes.css">
    <link rel="stylesheet" href="css/inicio.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- App instalable (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#172554">
    <link rel="icon" type="image/png" href="img/icono-192.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kennedy Tech">
  </head>

  <body>
    <div class="app">
      <div class="head">
        <div class="row">
          <div>
            <small>PANEL TÉCNICO</small>
            <h1 id="saludo"></h1>
          </div>

          <div class="sw">
            <span id="switch-texto"></span>
            <label class="switch">
              <input type="checkbox" id="switch-disponible">
              <i></i>
            </label>
          </div>
        </div>
      </div>

      <div class="wrap">
        <h2>Pedidos cerca tuyo</h2>
        <p class="m" id="mensaje-cerca">Buscando pedidos cerca...</p>
        <!-- Acá el JS agrega los pedidos nuevos de clientes cercanos (se actualiza solo) -->
        <div id="lista-cerca"></div>

        <h2>Servicios Pendientes</h2>
        <p id="mensaje-lista"></p>

        <!-- Acá el JS agrega una tarjeta por cada servicio pendiente -->
        <div id="lista-pedidos"></div>
      </div>
    </div>

    <!-- Molde de tarjeta: se clona una vez por servicio -->
    <template id="template-pedido">
      <div class="card pedido">
        <div class="row">
          <b data-campo="servicio"></b>
          <span data-campo="estado"></span>
        </div>

        <div class="kv">
          <i data-lucide="user-round"></i>
          <div>
            <b>Cliente</b>
            <span data-campo="cliente"></span>
          </div>
        </div>

        <div class="kv">
          <i data-lucide="map-pin"></i>
          <div>
            <b>Ubicación</b>
            <span data-campo="ubicacion"></span>
          </div>
        </div>

        <button class="btn btn-primary full" data-accion="ver" style="margin-top: 8px">
          <i data-lucide="eye"></i> Ver
        </button>
      </div>
    </template>

    <!-- Detalle del pedido (bottom sheet) -->
    <div class="sheet" id="detalle-pedido">
      <div class="panel">
        <div class="grab"></div>

        <div class="row">
          <h3 data-campo="numero"></h3>
          <span data-campo="estado"></span>
        </div>

        <p class="m" data-campo="servicio"></p>

        <div class="kv">
          <i data-lucide="user-round"></i>
          <div>
            <b>Cliente</b>
            <span data-campo="cliente"></span>
          </div>
        </div>

        <div class="kv">
          <i data-lucide="phone"></i>
          <div>
            <b>Teléfono</b>
            <span data-campo="telefono"></span>
          </div>
        </div>

        <div class="kv">
          <i data-lucide="map-pin"></i>
          <div>
            <b>Ubicación</b>
            <span data-campo="ubicacion"></span>
          </div>
        </div>

        <div class="kv">
          <i data-lucide="clock"></i>
          <div>
            <b>Horario</b>
            <span data-campo="horario"></span>
          </div>
        </div>

        <div class="kv">
          <i data-lucide="package"></i>
          <div>
            <b>Materiales</b>
            <span data-campo="materiales"></span>
          </div>
        </div>

        <div class="kv">
          <i data-lucide="file-text"></i>
          <div>
            <b>Detalle</b>
            <span data-campo="descripcion"></span>
          </div>
        </div>

        <div class="acciones">
          <a class="btn btn-ghost" id="btn-chatear" href="chat.html">
            <i data-lucide="message-circle"></i> Chatear
          </a>
          <a class="btn btn-ghost" id="btn-llegar" href="#" target="_blank" rel="noopener">
            <i data-lucide="navigation"></i> Cómo llegar
          </a>
          <a class="btn btn-ghost" id="btn-llamar" href="#">
            <i data-lucide="phone"></i> Llamar
          </a>
        </div>

        <iframe class="mapa" id="mapa-pedido" title="Mapa del pedido" loading="lazy"></iframe>

        <a class="btn btn-primary full" id="btn-atender" href="pedido_actual.html" style="margin-top: 6px">
          <i data-lucide="play"></i> Atender pedido
        </a>

        <button class="btn btn-ghost full" id="btn-cerrar-detalle" style="margin-top: 6px">
          <i data-lucide="x"></i> Cerrar
        </button>
      </div>
    </div>

    <script>lucide.createIcons();</script>
    <script src="js/app.js"></script>
    <script src="js/tecnico.inicio.js"></script>
  </body>
</html>
