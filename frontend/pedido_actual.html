<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <title>Pedido actual · Kennedy Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pedido.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- App instalable (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#172554">
    <link rel="icon" type="image/png" href="img/icono-192.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kennedy Tech">
  </head>

  <body>
    <div class="app">
      <div class="head">
        <a class="back-b" href="inicio.html"><i data-lucide="arrow-left"></i> Volver</a>
        <div class="row">
          <div>
            <small>PEDIDO ACTUAL</small>
            <h1 id="titulo">Pedido</h1>
          </div>
          <span id="estado"></span>
        </div>
      </div>

      <div class="wrap">
        <p class="m" id="mensaje"></p>

        <div class="card" id="datos" hidden>
          <div class="kv">
            <i data-lucide="user-round"></i>
            <div>
              <b>Cliente</b>
              <span id="cliente"></span>
            </div>
          </div>

          <div class="kv">
            <i data-lucide="map-pin"></i>
            <div>
              <b>Ubicación</b>
              <span id="ubicacion"></span>
            </div>
          </div>

          <div class="kv">
            <i data-lucide="clock"></i>
            <div>
              <b>Fecha y horario</b>
              <span id="horario"></span>
            </div>
          </div>

          <div class="kv">
            <i data-lucide="file-text"></i>
            <div>
              <b>Detalle</b>
              <span id="descripcion"></span>
            </div>
          </div>

          <div class="acciones">
            <a class="btn btn-ghost" id="btn-chatear" href="chat.html">
              <i data-lucide="message-circle"></i> Chatear
            </a>
            <a class="btn btn-ghost" id="btn-llegar" href="#" target="_blank" rel="noopener">
              <i data-lucide="navigation"></i> Cómo llegar
            </a>
            <a class="btn btn-ghost" id="btn-llamar" href="#">
              <i data-lucide="phone"></i> Llamar
            </a>
          </div>

          <iframe class="mapa" id="mapa-pedido" title="Mapa del pedido" loading="lazy"></iframe>

          <button class="btn btn-primary full" id="btn-estado">
            <i data-lucide="refresh-cw"></i> Cambiar estado
          </button>
        </div>

        <div class="card" id="trabajo" hidden>
          <div class="row">
            <b>Foto del trabajo terminado</b>
            <label class="btn btn-ghost btn-sm" for="foto-trabajo">
              <i data-lucide="camera"></i> <span id="texto-foto">Subir foto</span>
            </label>
          </div>
          <input type="file" id="foto-trabajo" accept="image/*" hidden>
          <p class="m" id="sin-foto">Cuando termines, sacale una foto al trabajo para que el cliente la vea.</p>
          <img class="foto-trabajo" id="imagen-trabajo" alt="Foto del trabajo terminado" hidden>
        </div>
      </div>
    </div>

    <div class="sheet" id="hoja-estado">
      <div class="panel">
        <div class="grab"></div>
        <h3>Cambiar estado</h3>
        <div class="opts" id="opciones-estado"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/fotos.js"></script>
    <script src="js/tecnico.pedido.js"></script>
  </body>
</html>
