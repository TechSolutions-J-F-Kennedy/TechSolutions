<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Herramientas · Kennedy Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="herramientas.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app">
    <div class="head">
      <small>PRÓXIMAMENTE</small>
      <h1>Herramientas</h1>
    </div>
    <div class="wrap">
      <div class="g">
        <div class="card">
          <i data-lucide="ruler"></i>
          <b>Medidas</b>
          <small>Próximamente</small>
        </div>
        <div class="card">
          <i data-lucide="calculator"></i>
          <b>Calculadora</b>
          <small>Próximamente</small>
        </div>
        <div class="card">
          <i data-lucide="qr-code"></i>
          <b>Escáner QR</b>
          <small>Próximamente</small>
        </div>
        <div class="card">
          <i data-lucide="file-text"></i>
          <b>Reportes</b>
          <small>Próximamente</small>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
